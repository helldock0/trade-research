# Approximate retail/prop-style costs on mid price fills
default:
  half_spread_pips: 0.6
  slippage_pips: 0.2
  commission_per_lot_usd: 7.0  # round-turn proxy

pairs:
  EURUSD:
    half_spread_pips: 0.5
    slippage_pips: 0.2
    commission_per_lot_usd: 7.0
  GBPUSD:
    half_spread_pips: 0.7
    slippage_pips: 0.25
    commission_per_lot_usd: 7.0
  USDJPY:
    half_spread_pips: 0.6
    slippage_pips: 0.2
    commission_per_lot_usd: 7.0
  AUDUSD:
    half_spread_pips: 0.7
    slippage_pips: 0.25
    commission_per_lot_usd: 7.0
  USDCAD:
    half_spread_pips: 0.8
    slippage_pips: 0.25
    commission_per_lot_usd: 7.0
  NZDUSD:
    half_spread_pips: 0.8
    slippage_pips: 0.25
    commission_per_lot_usd: 7.0
  USDCHF:
    half_spread_pips: 0.8
    slippage_pips: 0.25
    commission_per_lot_usd: 7.0
  # crosses: wider than the majors (conservative retail/prop estimates)
  EURJPY:
    half_spread_pips: 0.9
    slippage_pips: 0.3
    commission_per_lot_usd: 7.0
  GBPJPY:
    half_spread_pips: 1.3
    slippage_pips: 0.4
    commission_per_lot_usd: 7.0
  AUDJPY:
    half_spread_pips: 0.9
    slippage_pips: 0.3
    commission_per_lot_usd: 7.0
  EURGBP:
    half_spread_pips: 0.8
    slippage_pips: 0.25
    commission_per_lot_usd: 7.0
  # USD index CFDs: "pips" are index points (pip_size 1.0), no commission
  NAS100:
    half_spread_pips: 1.0
    slippage_pips: 0.5
    commission_per_lot_usd: 0.0
  US500:
    half_spread_pips: 0.3
    slippage_pips: 0.2
    commission_per_lot_usd: 0.0
  US30:                      # Dukascopy spread near the US close: ~2.3 points
    half_spread_pips: 1.2
    slippage_pips: 0.6
    commission_per_lot_usd: 0.0
  XAUUSD:
    half_spread_pips: 20.0
    slippage_pips: 5.0
    commission_per_lot_usd: 7.0

pip_size:
  EURUSD: 0.0001
  GBPUSD: 0.0001
  USDJPY: 0.01
  AUDUSD: 0.0001
  USDCAD: 0.0001
  NZDUSD: 0.0001
  USDCHF: 0.0001
  EURJPY: 0.01
  GBPJPY: 0.01
  AUDJPY: 0.01
  EURGBP: 0.0001
  NAS100: 1.0
  US500: 1.0
  US30: 1.0
  XAUUSD: 0.01

# Units per lot where it is not 100k FX / 100 oz gold: USD index CFDs at $1 per point per lot
contracts:
  NAS100: 1.0
  US500: 1.0
  US30: 1.0
