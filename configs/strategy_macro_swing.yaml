strategy: macro_swing

# Fundamentals pick the pair and the direction (currency scores -> pair bias);
# the D1 trigger times the entry; ATR sets the risk; the bias flip exits.
universe:
  - EURUSD
  - GBPUSD
  - USDJPY
  - AUDUSD
  - USDCAD

timeframe: M15

sessions:
  timezone: UTC
  asian_start: "00:00"
  asian_end: "07:00"
  london_start: "07:00"
  london_end: "11:00"
  ny_start: "13:30"
  ny_end: "16:00"
  overnight_anchor: "21:00"
  friday_no_new_entries: "16:00"
  friday_hard_flat: "20:00"
  signal_time: "21:00"       # daily decision bar (UTC)

signal:
  min_abs_bias: 0.75         # pair bias (score units) needed to trade
  exit_abs_bias: 0.0         # close when the bias crosses back through this level
  exit_on_bias_flip: true
  trigger: pullback          # none | pullback | breakout
  ema_period: 20             # D1 EMA for the pullback trigger
  donchian_period: 20        # D1 channel for the breakout trigger
  reentry_cooldown_days: 5
  atr_period: 20
  stop_atr_mult: 2.0
  take_profit_r: 3.0
  breakeven_at_r: 1.0
  exit_mode: swing
  allow_weekend_hold: true
  max_hold_days: 20

risk:
  risk_per_trade_pct: 0.5
  max_open_positions: 1
  soft_daily_halt_pct: 2.0

news:
  enabled: true
  blackout_minutes: 60
  calendar_csv: data/events_calendar.csv

macro:
  cache_dir: data/macro
  currencies: [USD, EUR, GBP, JPY, AUD, CAD]
  min_components: 2
  lags:
    market_days: 1           # daily market data usable from the next day
    cot_days: 3              # Tuesday positions published Friday
    ffill_limit_days: 45
  # scripts/download_macro.py fetches these into data/macro/{group}_{CCY}.csv
  series:
    rate_2y:
      USD: {source: fred, id: DGS2}
      EUR: {source: ecb, key: "YC/B.U2.EUR.4F.G_N_A.SV_C_YM.SR_2Y"}   # AAA euro area 2y spot
      GBP: {source: boe, code: IUDSNPY}                               # 5y nominal par yield (2y proxy)
      JPY: {source: mof, column: "2Y"}
      AUD: {source: rba, table: f2, series_id: FCMYGBAG2D}
      CAD: {source: boc, series: BD.CDN.2YR.DQ.YLD}
      CHF: {source: snb, cube: rendeiduebd, dims: {D0: CHF, D1: 2J}}   # Swiss Confederation 2y; published monthly
      # NZD: no free daily 2y reachable (RBNZ blocks scripted downloads); NZD scores without rate momentum
    policy_rate:
      USD: {source: bis_policy, area: US}
      EUR: {source: bis_policy, area: XM}
      GBP: {source: bis_policy, area: GB}
      JPY: {source: bis_policy, area: JP}
      AUD: {source: bis_policy, area: AU}
      CAD: {source: bis_policy, area: CA}
      CHF: {source: bis_policy, area: CH}
      NZD: {source: bis_policy, area: NZ}
    cot_net:                 # leveraged-money net / open interest (CFTC TFF)
      EUR: {source: cftc_tff, market: "EURO FX", start_year: 2010}
      GBP: {source: cftc_tff, market: "BRITISH POUND", start_year: 2010}
      JPY: {source: cftc_tff, market: "JAPANESE YEN", start_year: 2010}
      AUD: {source: cftc_tff, market: "AUSTRALIAN DOLLAR", start_year: 2010}
      CAD: {source: cftc_tff, market: "CANADIAN DOLLAR", start_year: 2010}
      CHF: {source: cftc_tff, market: "SWISS FRANC", start_year: 2010}
      NZD: {source: cftc_tff, market: ["NEW ZEALAND DOLLAR", "NZ DOLLAR"], start_year: 2010}   # renamed in 2022
      USD: {derive: neg_mean_others}
    global:
      vix: {source: fred, id: VIXCLS}
      spx: {source: fred, id: SP500}
      oil: {source: fred, id: DCOILWTICO}
      copper: {source: fred, id: PCOPPUSDM, lag_days: 35}            # monthly IMF price
  riskoff:
    window_days: 252
    equity_lookback_days: 20
  components:
    rate_momentum:
      weight: 1.0
      input: rate_2y
      transform: diff
      lookback_days: 60
      standardize: cross_section
    carry:
      weight: 0.5
      input: policy_rate
      transform: level
      standardize: cross_section
    risk:
      weight: 0.5
      input: riskoff
      standardize: time_series
      window_days: 252
      beta: {USD: 0.5, JPY: 1.0, CHF: 1.0, EUR: 0.0, GBP: -0.3, AUD: -1.0, NZD: -1.0, CAD: -0.7}
    commodity_energy:
      weight: 0.5
      input: oil
      transform: pct_change
      lookback_days: 60
      standardize: time_series
      window_days: 252
      beta: {CAD: 1.0}
    commodity_metals:
      weight: 0.25
      input: copper
      transform: pct_change
      lookback_days: 60
      standardize: time_series
      window_days: 252
      beta: {AUD: 1.0}
    positioning:
      weight: 0.5
      input: cot_net
      transform: level
      standardize: time_series
      window_days: 756
      sign: -1               # crowded positioning is a mild contrarian signal

# Trade-management variants for scripts/run_macro_compare.py, deep-merged over
# this file. Added after the trigger:none NO-GO (2026-10-22) at the owner's
# request; the values were fixed before any run and are not tuned.
#   take_profit_r: 0     -> no fixed target
#   trailing_stop_r: R   -> after each bar the stop ratchets to R x initial risk
#                           behind the best price since entry (1.0 = 2 ATR here)
#   max_signed_corr      -> skip a new trade whose 60d daily-return correlation
#                           with an open one, signed by both sides, exceeds this
variants:
  fixed_tp:                  # the Phase B baseline: 3R target, one position
    signal: {trigger: none}
  trail:                     # trailing stop instead of the fixed target
    signal: {trigger: none, take_profit_r: 0, trailing_stop_r: 1.0, max_hold_days: 0}
  basket:                    # trailing stop + up to 3 positions, correlation-gated
    signal: {trigger: none, take_profit_r: 0, trailing_stop_r: 1.0, max_hold_days: 0}
    risk: {max_open_positions: 3, max_signed_corr: 0.6, corr_window_days: 60}
  # Signal variants on the basket (added 2026-10-22, values fixed before any run).
  # `extends` merges onto another variant.
  hikes:                     # + market-implied rate path: 2y yield minus policy rate
    extends: basket
    macro:
      components:
        rate_expectations: {weight: 1.0, input: rate_2y, subtract: policy_rate, transform: level, standardize: cross_section}
  wide:                      # + NZD, CHF and four crosses: more bets that are not the same USD bet
    extends: basket
    universe: [EURUSD, GBPUSD, USDJPY, AUDUSD, USDCAD, NZDUSD, USDCHF, EURJPY, GBPJPY, AUDJPY, EURGBP]
    macro:
      currencies: [USD, EUR, GBP, JPY, AUD, CAD, CHF, NZD]
  wide_hikes:
    extends: wide
    macro:
      components:
        rate_expectations: {weight: 1.0, input: rate_2y, subtract: policy_rate, transform: level, standardize: cross_section}

# Pre-registered (2026-10-22, before any run) by scripts/run_macro_ic.py --validate:
# a signal variant is kept only if its pooled 20d IC beats the base config's on
# both periods and is positive on the holdout. Bars start in 2018, so the
# holdout is checked on FRED daily FX only.
validation:
  baseline: fixed_tp
  variants: [hikes, wide, wide_hikes]
  dev: ["2018-01-01", null]
  holdout: ["2012-01-01", "2017-12-31"]

data:
  start: "2018-01-01"
  end: null
  cache_dir: data/parquet
