# NY kill-zone breakout v4 (prop firm) — NAS100 M5, real Dukascopy bid/ask spread
# v4 = v3 (next-candle-confirmed break, 2x ATR stop) + skip the quietest 20% of
# days by prior-day ATR + 3R target: lower drawdown and shorter losing streaks
# for prop-firm loss limits. Normal accounts use v3 (strategy_nykz_breakout.yaml).
# Run: python scripts/run_nykz_breakout.py --config strategy_nykz_breakout_prop.yaml
strategy: nykz_breakout_prop

symbol: NAS100
timeframe: M5

session:
  # All times are New York local, so the IST clock shifts with US DST:
  #   range 07:00-10:00 NY = 16:30-19:30 IST (US summer) / 17:30-20:30 IST (US winter)
  #   cutoff 16:55 NY      = 02:25 IST (US summer)       / 03:25 IST (US winter)
  timezone: America/New_York
  range_start: "07:00"
  range_end: "10:00"
  entry_cutoff: "16:55"  # latest entry fill (entry bar close); CFD closes 16:15 NY

signal:
  min_range_bars: 30       # skip days with a patchy range (full range = 36 bars)
  stop_buffer_points: 2.0  # break-candle stop, still used to skip entries that close beyond it
  take_profit_r: 3.0       # v3: 4R
  confirm_close: true
  atr_period: 14
  atr_stop_mult: 2.0
  min_daily_atr_pctile: 0.2  # skip days whose prior-day ATR(14)/price ranks in the bottom 20%
  vol_lookback_days: 100     # ... of the previous 100 trading days

data:
  start: "2023-01-01"
  end: null
  cache_dir: data/parquet
