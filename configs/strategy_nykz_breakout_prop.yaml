# NY kill-zone breakout, prop-firm account — NAS100 M5, real Dukascopy bid/ask spread
# Same rules as v3 (strategy_nykz_breakout.yaml; a test keeps them identical),
# risking 1% of the starting balance per trade.
# FTMO 2-step sim at 1%: ~52% of challenges pass, median ~2 months
# (python scripts/prop_sim_nykz_breakout.py). v4 (v3 + quiet-day filter + 3R)
# was dropped: no higher pass rate and about half as fast.
# Run: python scripts/run_nykz_breakout.py --config strategy_nykz_breakout_prop.yaml
strategy: nykz_breakout_prop

symbol: NAS100
timeframe: M5

session:
  # All times are New York local, so the IST clock shifts with US DST:
  #   range 07:00-10:00 NY = 16:30-19:30 IST (US summer) / 17:30-20:30 IST (US winter)
  #   cutoff 16:55 NY      = 02:25 IST (US summer)       / 03:25 IST (US winter)
  timezone: America/New_York
  range_start: "07:00"
  range_end: "10:00"
  entry_cutoff: "16:55"  # latest entry fill (entry bar close); CFD closes 16:15 NY

signal:
  min_range_bars: 30       # skip days with a patchy range (full range = 36 bars)
  stop_buffer_points: 2.0  # break-candle stop, still used to skip entries that close beyond it
  take_profit_r: 4.0
  confirm_close: true
  atr_period: 14
  atr_stop_mult: 2.0

risk:
  risk_per_trade_pct: 1.0  # % of the starting balance per trade (1R)

data:
  start: "2023-01-01"
  end: null
  cache_dir: data/parquet
