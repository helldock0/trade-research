universe:
  - EURUSD
  - GBPUSD
  - USDJPY
  - AUDUSD
  - USDCAD

timeframe: M15
regime_timeframe: H1

sessions:
  timezone: UTC
  asian_start: "00:00"
  asian_end: "07:00"
  london_start: "07:00"
  london_end: "11:00"
  ny_start: "13:30"
  ny_end: "16:00"
  overnight_anchor: "21:00"
  friday_no_new_entries: "16:00"
  friday_hard_flat: "20:00"

signal:
  atr_period: 20
  atr_lookback_days: 60
  range_pct_low: 0.25
  range_pct_high: 0.70
  momentum_tercile: top  # top tercile continuation only
  stop_buffer_pips: 2.0
  take_profit_r: 1.5
  enable_ny_session: true
  # v1.1 exit hypothesis: hold all trades to NY close; BE trail at +1R
  exit_mode: hold_to_ny
  breakeven_at_r: 1.0
  # v1.2 entry filter: require next M15 bar to continue beyond the break
  require_confirm_bar: true

risk:
  risk_per_trade_pct: 0.5
  max_open_positions: 1
  soft_daily_halt_pct: 2.0

news:
  enabled: true
  blackout_minutes: 60
  calendar_csv: data/news_calendar.csv

data:
  start: "2018-01-01"
  end: null  # null = today
  cache_dir: data/parquet
