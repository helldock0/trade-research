strategy: d1_mom

universe:
  - EURUSD
  - GBPUSD
  - USDJPY
  - AUDUSD
  - USDCAD

timeframe: M15

sessions:
  timezone: UTC
  asian_start: "00:00"
  asian_end: "07:00"
  london_start: "07:00"
  london_end: "11:00"
  ny_start: "13:30"
  ny_end: "16:00"
  overnight_anchor: "21:00"
  friday_no_new_entries: "16:00"
  friday_hard_flat: "20:00"
  # Decision bar for D1 mom (UTC)
  signal_time: "21:00"

signal:
  formation_days: 20
  history_days: 60
  winner_percentile: 0.80
  loser_percentile: 0.20
  atr_period: 20
  stop_atr_mult: 1.5
  take_profit_r: 2.0
  breakeven_at_r: 1.0
  exit_mode: swing
  allow_weekend_hold: true
  max_hold_days: 10

risk:
  risk_per_trade_pct: 0.5
  max_open_positions: 1
  soft_daily_halt_pct: 2.0

news:
  enabled: true
  blackout_minutes: 60
  calendar_csv: data/news_calendar.csv

data:
  start: "2018-01-01"
  end: null
  cache_dir: data/parquet
