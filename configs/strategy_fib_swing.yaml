# Fibonacci retracement FX swing — H4 (research / unproven)
#
# Conventions:
# - Trend = 200 EMA slope over slope_lookback (not flat)
# - Tap = bar trades within tap_atr_mult * ATR of 50 or 200 EMA
# - Long fib: fractal high (0) → fractal low (1); short: low (0) → high (1)
# - Require |fib_0.71 - tapped EMA| / price <= fib_align_pct (0.25%)
# - Entry = engulfing/pin reversal closing beyond EMA and 0.71
# - SL = tap extreme (min min_stop_pips); TP take_profit_r
strategy: fib_swing

universe:
  - EURUSD
  - GBPUSD
  - USDJPY
  - AUDUSD
  - USDCAD

timeframe: M15
regime_timeframe: H4

sessions:
  timezone: UTC
  asian_start: "00:00"
  asian_end: "07:00"
  london_start: "07:00"
  london_end: "11:00"
  ny_start: "13:30"
  ny_end: "16:00"
  overnight_anchor: "21:00"
  friday_no_new_entries: "16:00"
  friday_hard_flat: "20:00"

signal:
  htf_rule: "4h"
  ema_slow: 200
  ema_fast: 50
  slope_lookback: 5
  fib_level: 0.71
  fib_align_pct: 0.0025
  tap_atr_mult: 0.35
  atr_period: 14
  min_stop_pips: 10.0
  take_profit_r: 2.0
  exit_mode: swing
  allow_weekend_hold: true
  max_hold_days: 15
  breakeven_at_r: 0.0
  min_htf_bars: 220

risk:
  risk_per_trade_pct: 0.5
  max_open_positions: 1
  soft_daily_halt_pct: 2.0

news:
  enabled: true
  blackout_minutes: 60
  calendar_csv: data/news_calendar.csv

data:
  start: "2018-01-01"
  end: null
  cache_dir: data/parquet
