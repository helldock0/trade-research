[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-research"
version = "0.1.0"
description = "Prop challenge research harness (multi-strategy FTMO-style backtests)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15",
  "pyyaml>=6",
  "matplotlib>=3.8",
  "dukascopy-python>=4.0",
  "requests>=2.31",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
trade-download = "scripts.download_data:main"
trade-backtest = "scripts.run_backtest:main"
trade-walkforward = "scripts.run_walkforward:main"
trade-prop = "scripts.run_prop_sim:main"
trade-all = "scripts.run_all:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]

[tool.setuptools.package-dir]
"" = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
