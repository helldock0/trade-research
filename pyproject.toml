[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cssm-prop"
version = "0.1.0"
description = "Cross-Sectional Session Momentum research harness for FTMO-style prop challenges"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15",
  "pyyaml>=6",
  "matplotlib>=3.8",
  "dukascopy-python>=4.0",
  "requests>=2.31",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cssm-download = "scripts.download_data:main"
cssm-backtest = "scripts.run_backtest:main"
cssm-walkforward = "scripts.run_walkforward:main"
cssm-prop = "scripts.run_prop_sim:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]

[tool.setuptools.package-dir]
"" = "."
